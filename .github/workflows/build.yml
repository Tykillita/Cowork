name: build

# Version, types, build and unit tests on every push to main and every pull request.
# The emulator suites (rules, Spark backend, e2e) stay local: see the README, «Pruebas».
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version matches everywhere
        run: npm run version:check
      - run: npm run build
      - run: npm run test:unit
